[workspace]
resolver = "2"
members = ["packages/core", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Sam"]
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
rusqlite = { version = "0.37", features = ["bundled"] }

# Debug builds of WebKit-adjacent crates are large; keep dev builds fast
[profile.dev]
incremental = true

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
